name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  plugin-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check the tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG#v}"
          version="$(awk -F"'" '/^const VERSION = / { print $2; exit }' pengu-plugin/better-lol-chat/index.js | tr -d '\r')"
          if [ "$tag" != "$version" ]; then
            echo "Release tag ${RELEASE_TAG} does not match VERSION ${version}"
            exit 1
          fi

      - name: Zip the plugin folder
        run: |
          cd pengu-plugin
          zip -r "$RUNNER_TEMP/better-lol-chat.zip" better-lol-chat

      - name: Write the installer
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          python3 scripts/write-install-bat.py "$RELEASE_TAG" "$RUNNER_TEMP/blc-install-${version}.bat"

      - name: Attach the release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          cp "$RUNNER_TEMP/blc-install-${version}.bat" "$RUNNER_TEMP/install.bat"
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/better-lol-chat.zip" \
            "$RUNNER_TEMP/blc-install-${version}.bat" \
            "$RUNNER_TEMP/install.bat" \
            --clobber
